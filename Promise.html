<script>
  function prom(a){
    return new Promise((resolve,reject) => {
      if(a){
        resolve("yes")
      }else{
        reject("no")
      }
    })
  }

  // console.log(prom(true))
  prom(true).then((result) =>{
    console.log(result)
  }).catch((error) =>{
    console.log(error)
  })

  console.log("hello gwalior")
</script>
